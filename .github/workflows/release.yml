# Release: a pushed v* tag builds the darwin/arm64 binary and attaches it
# to a generated GitHub Release as ccms-macos-<tag>.zip (tag verbatim, "v"
# included). Cross-compiled on ubuntu — Go needs no macOS runner for this,
# and macOS minutes cost 10x.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build darwin/arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o bin/ccms ./cmd/ccms
      - name: Zip binary to archive root
        run: zip -j "ccms-macos-${GITHUB_REF_NAME}.zip" bin/ccms
      - name: Create release with the artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ccms-macos-${GITHUB_REF_NAME}.zip" --generate-notes
