# Release: a pushed v* tag builds the darwin/arm64 binary and attaches it
# to a generated GitHub Release as ccx-macos-<tag>.zip (tag verbatim, "v"
# included). Cross-compiled on ubuntu — Go needs no macOS runner for this,
# and macOS minutes cost 10x.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build darwin/arm64
        # the tag is baked into cli.Version: a released binary must not
        # answer "dev" to `ccx version`
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath
          -ldflags "-X github.com/ivangurin/ccx/internal/cli.Version=${GITHUB_REF_NAME}"
          -o bin/ccx ./cmd/ccx
      - name: Zip binary to archive root
        run: zip -j "ccx-macos-${GITHUB_REF_NAME}.zip" bin/ccx
      - name: Create release with the artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ccx-macos-${GITHUB_REF_NAME}.zip" --generate-notes
